{% extends 'base.html' %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="mb-1">注册新账号</h4>
        <p class="text-muted small mb-4">注册后即可打卡、上传资料、发评论</p>

        <form method="post" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label">用户名 <span class="text-danger">*</span></label>
            <input type="text" name="username" class="form-control" placeholder="2-32 个字符" required>
          </div>
          <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input type="email" name="email" class="form-control" placeholder="选填">
          </div>
          <div class="mb-3">
            <label class="form-label">密码 <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" placeholder="至少 6 位" required>
          </div>
          <div class="mb-3">
            <label class="form-label">确认密码 <span class="text-danger">*</span></label>
            <input type="password" name="password2" class="form-control" placeholder="再输入一次" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">注 册</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          已有账号？<a href="{{ url_for('auth.login') }}">去登录</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
